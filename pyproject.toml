[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-bpe"
version = "1.0.0"
description = "Morfem öncelikli iki aşamalı Türkçe byte düzeyi BPE tokenizer eğitimi"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "tokenizers==0.23.3",
    "transformers==5.22.2",
    "zemberek-python==0.2.3",
    "antlr4-python3-runtime==4.8",
    "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nc-bpe = "nc_bpe.cli:main"

[tool.setuptools]
packages = ["nc_bpe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
